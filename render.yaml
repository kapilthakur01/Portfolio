services:
  # ── 1. Backend API (Node.js + Express + MongoDB) ──────────────────────────
  - type: web
    name: kapil-portfolio-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: MONGODB_URI
        value: mongodb+srv://kr8724318_db_user:HPODgbznMLCTaU8F@cluster0.egawmwf.mongodb.net/kr8724318_db_user?retryWrites=true&w=majority&appName=Cluster0
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

  # ── 2. Frontend (React + Vite Static Site) ────────────────────────────────
  - type: web
    name: kapil-portfolio
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://kapil-portfolio-api.onrender.com/api
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
